services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  kafka-init:
    image: apache/kafka:4.2.0

    depends_on:
      kafka:
        condition: service_healthy

    volumes:
      - ./scripts/init-kafka.sh:/init-kafka.sh

    entrypoint: ["/bin/bash", "/init-kafka.sh"]


  # --- The platform: started only with `docker compose --profile platform up`. -----------------
  # Without the profile, `docker compose up` starts only Kafka, for the scripts and tests that run
  # the Java and Python programs on this machine.

  engine:
    profiles: ["platform"]
    build: ./java-engine
    image: market-data/java-engine:dev
    command: ["com.marketdata.app.MarketDataConsumerMain"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  simulator:
    profiles: ["platform"]
    image: market-data/java-engine:dev
    command: ["com.marketdata.app.MarketDataSimulatorMain", "0"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      engine:
        condition: service_started
    restart: unless-stopped

  monitor:
    profiles: ["platform"]
    build: ./python-monitor
    image: market-data/python-monitor:dev
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - monitor-data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    profiles: ["platform"]
    image: market-data/python-monitor:dev
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    volumes:
      - monitor-data:/data
    depends_on:
      monitor:
        condition: service_started
    restart: unless-stopped


volumes:
  kafka-data:
  monitor-data:
